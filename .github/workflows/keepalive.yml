name: Keep database awake
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -o "https://[a-z0-9-]*\.supabase\.co" config.js | head -1)
          KEY=$(grep -o "eyJ[A-Za-z0-9_.-]*\|sb_publishable_[A-Za-z0-9_-]*" config.js | head -1)
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "ping status $code"
          test "$code" = "200"
